{% extends template.self %}

{% block javascript %}
    {{ super() }}
    <script>
        (function() {
            function scrollActiveToView() {
                var activeElement = document.querySelector('.book-summary li.active') ||
                                    document.querySelector('.book-summary li.chapter.active') ||
                                    document.querySelector('.book-summary .active');
                if (activeElement) {
                    var summary = document.querySelector('.book-summary');
                    if (summary) {
                        var containerRect = summary.getBoundingClientRect();
                        var elementRect = activeElement.getBoundingClientRect();
                        
                        // Check if the element is out of the visible viewport of the sidebar
                        if (elementRect.top < containerRect.top || elementRect.bottom > containerRect.bottom) {
                            // Scroll the active link to the middle of the sidebar viewport
                            summary.scrollTop = activeElement.offsetTop - (summary.clientHeight / 2) + (activeElement.clientHeight / 2);
                        }
                    }
                }
            }

            // Scroll immediately when DOM is ready
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', scrollActiveToView);
            } else {
                scrollActiveToView();
            }

            // Listen for HonKit's page change event (client-side transitions)
            var gitbook = window.gitbook || [];
            gitbook.push(function() {
                gitbook.events.bind("page.change", scrollActiveToView);
            });
        })();
    </script>
{% endblock %}
