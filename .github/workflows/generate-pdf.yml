name: Generate Guidebook PDF

on:
  push:
    branches:
      - main
    paths:
      - '0*/**/*.md'
      - 'compliance/**/*.md'
      - 'roadmap/**/*.md'
      - 'README.md'
      - 'scripts/compile_docs.py'
      - 'scripts/generate_pdf.js'
      - 'scripts/pdf-style.css'
      - 'package.json'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force full rebuild of PDF (bypass cache)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Cache for Pre-compiled PDF
        if: ${{ !inputs.force_rebuild }}
        id: pdf-cache
        uses: actions/cache@13aacd865c20de90d75de1680084388d25d060aa # v4.2.2
        with:
          path: AD-Hardening-Guidebook.pdf
          key: pdf-${{ hashFiles('0*/**/*.md', 'compliance/**/*.md', 'roadmap/**/*.md', 'README.md', 'scripts/pdf-style.css', 'scripts/generate_pdf.js', 'scripts/compile_docs.py') }}

      - name: Set up Python
        if: steps.pdf-cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Set up Node.js
        if: steps.pdf-cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        if: steps.pdf-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Generate PDF from Markdown
        if: steps.pdf-cache.outputs.cache-hit != 'true'
        run: npm run pdf:build

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Active-Directory-Hardening-Guidebook
          path: AD-Hardening-Guidebook.pdf
